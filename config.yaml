# ── Huurbot instellingen ─────────────────────────────────────────
# Pas dit bestand aan en commit het; de bot gebruikt het bij de volgende run.

# Prijsfilter (kale huur per maand, in euro's).
min_price: 800
max_price: 1800

# Minimale woonoppervlakte in m² (0 = geen filter)
min_area: 0

# Plaatsen binnen ~10 km van Gouda (kleine letters, streepjes).
places:
  - gouda
  - bodegraven
  - waddinxveen
  - reeuwijk
  - moordrecht
  - haastrecht
  - stolwijk
  - boskoop
  - nieuwerkerk-aan-den-ijssel
  - zevenhuizen

# ── Grote portals (ingebouwd, zoeken per plaats) ─────────────────
portals:
  pararius: true
  huurwoningen: true
  funda: true

# ── Verhuurders / makelaars ──────────────────────────────────────
# Per site één of meer aanbodpagina's. De bot meldt elke NIEUWE link op
# die pagina('s) waarin een van je plaatsen voorkomt.
# {place} in een URL = de bot herhaalt die URL voor elke plaats hierboven.
# pattern = stukje (regex) dat in elke advertentie-URL zit, om menu-links te negeren.
sites:
  - name: Stienstra Wonen
    urls: ["https://www.stienstra.nl/uitgebreid-zoeken?lat=52.0115205&lng=4.7104633&use_radius=on&search_location=Gouda%2C+Nederland&radius=15&min-price=0&max-price=500000"]
    pattern: "/woning/"
  - name: Vesteda
    api: vesteda            # site laadt woningen via JavaScript: speciale koppeling
    urls: []
  - name: Ikwilhuren (MVGM)
    # landelijk aanbod, nieuwste eerst: de bot filtert zelf op je plaatsen
    urls:
      - "https://ikwilhuren.nu/aanbod/?sort=aanbodDESC&page=1"
      - "https://ikwilhuren.nu/aanbod/?sort=aanbodDESC&page=2"
      - "https://ikwilhuren.nu/aanbod/?sort=aanbodDESC&page=3"
    pattern: "/object/"
  - name: VB&T Verhuurmakelaars
    urls:
      - "https://vbtverhuurmakelaars.nl/woningen/1"
      - "https://vbtverhuurmakelaars.nl/woningen/2"
      - "https://vbtverhuurmakelaars.nl/woningen/3"
      - "https://vbtverhuurmakelaars.nl/woningen/4"
      - "https://vbtverhuurmakelaars.nl/woningen/5"
    pattern: "/woning/"
  - name: Rotsvast
    urls: ["https://www.rotsvast.nl/huren/?search={place}"]
    pattern: "/huren/[^/?]+-h\\d+/?$"
  - name: 123Wonen
    urls: ["https://www.123wonen.nl/huurwoningen/in/{place}/sort/newest"]
    pattern: "/huur/[^/]+/[^/]+/[^/]+"
