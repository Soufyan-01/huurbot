# ── Huurbot instellingen ─────────────────────────────────────────
# Pas dit bestand aan en commit het; de bot gebruikt het bij de volgende run.

# Prijsfilter (kale huur per maand, in euro's).
min_price: 800
max_price: 1800

# Minimale woonoppervlakte in m² (0 = geen filter)
min_area: 0

# Woningen met deze woorden in de link of tekst worden overgeslagen
exclude_words:
  - recreatiewoning
  - vakantiewoning
  - parkeerplaats
  - garagebox
  - berging

# Plaatsen binnen ~10 km van Gouda (kleine letters, streepjes).
places:
  - gouda
  - bodegraven
  - waddinxveen
  - reeuwijk
  - moordrecht
  - haastrecht
  - stolwijk
  - boskoop
  - nieuwerkerk-aan-den-ijssel
  - zevenhuizen

# ── Grote portals (ingebouwd, zoeken per plaats) ─────────────────
# Uitgezet: deze blokkeren GitHub. Gebruik hun eigen app/e-mailalerts.
portals:
  pararius: false
  huurwoningen: false
  funda: false

# ── Verhuurders / makelaars ──────────────────────────────────────
# Per site één of meer aanbodpagina's. De bot meldt elke NIEUWE link op
# die pagina('s) waarin een van je plaatsen voorkomt.
# {place} in een URL = de bot herhaalt die URL voor elke plaats hierboven.
# pattern = stukje (regex) dat in elke advertentie-URL zit, om menu-links te negeren.
# Opties per site:
#   {place} in URL  = herhaal voor elke plaats hierboven
#   {page} in URL   = blader door pagina's tot de laatste (max_pages)
#   radius_filtered = site filtert zelf op afstand; dan ook plaatsen buiten je lijst tonen
#   pattern         = stukje (regex) dat in elke advertentie-URL zit
sites:
  - name: Stienstra Wonen
    urls: ["https://www.stienstra.nl/uitgebreid-zoeken?lat=52.0115205&lng=4.7104633&use_radius=on&search_location=Gouda%2C+Nederland&radius=15&min-price=0&max-price=500000"]
    pattern: "/woning/"
    radius_filtered: true
  - name: Vesteda
    api: vesteda
    radius: 20
  - name: Ikwilhuren (MVGM)
    # TIJDELIJK: landelijk nieuwste aanbod. Vervang door de URL van een zoekopdracht op Gouda + straal.
    urls: ["https://ikwilhuren.nu/aanbod/?sort=aanbodDESC&page={page}"]
    max_pages: 3
    pattern: "/object/"
  - name: VB&T Verhuurmakelaars
    urls: ["https://vbtverhuurmakelaars.nl/woningen/{page}"]
    max_pages: 25
    pattern: "/woning/"
  - name: Rotsvast
    urls: ["https://www.rotsvast.nl/huren/?search={place}"]
    pattern: "/huren/[^/?]+-h\\d+/?$"
  - name: 123Wonen
    urls: ["https://www.123wonen.nl/huurwoningen/in/{place}/sort/newest"]
    pattern: "/huur/[^/]+/[^/]+/[^/]+"
